# dsh-ding bundle patch layer — installed automatically when this package is
# added as a bundle (dsh plugin --profile web add dsh-ding / github:CAOGGL/dsh-ding).
# Users can override any of these in their profile's own cordis.patch.yml.
- insert:
    - id: dsh-ding
      name: 'dsh-ding'
      # 声明对 webServer 服务的依赖：确保 HTTP 控制面路由挂载时 webServer 已就绪
      inject: ['webServer']
      config:
        sound: true
        balloon: true
        title: 'DSH 完成'
        debounceMs: 200
        minIntervalMs: 3000
        # 当前会话免打扰（默认 true）：窗口在前台且完成的会话正是正在查看的会话时静默，
        # 切走窗口 / 看别的会话 / 没开对话页时照常提醒
        quietOnViewing: true
        # 长任务运行中提醒（默认 true）：只弹 Windows 通知、不响铃
        runningNotify: true
        runningFirstAfterMs: 180000   # 运行 3 分钟后首次提醒
        runningIntervalMs: 300000     # 之后每 5 分钟提醒一次
        # 用户提问提醒（默认 true）：Agent 调用 ask_user_question 等待回答时立即提醒
        questionNotify: true
        questionTitle: 'DSH 提问'    # 提问提醒的通知标题
        # 通知应用显示名（空=跟随语言自动切换：中文 DSH叮当通知 / 英文 dsh-ding-notifier）
        notifierName: ''
